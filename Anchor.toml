[toolchain]
anchor_version = "1.1.2"
solana_version = "3.1.10"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[workspace]
types = "apps/web/lib/anchor-types"

[programs.localnet]
pwrc_sale = "4snMyVjPbQMkZDQ6BKqrEv1HfJxVKwvpXvT2pB4QELiM"

[programs.devnet]
pwrc_sale = "4snMyVjPbQMkZDQ6BKqrEv1HfJxVKwvpXvT2pB4QELiM"

# Anchor names the production cluster "mainnet"; web3.js / Wallet Standard use "mainnet-beta".
[programs.mainnet]
pwrc_sale = "4snMyVjPbQMkZDQ6BKqrEv1HfJxVKwvpXvT2pB4QELiM"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm run test:unit"
